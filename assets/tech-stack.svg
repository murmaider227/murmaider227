      <rect x="596" y="346" width="170" height="42" rx="8" fill="#0F172A" stroke="#34D399" stroke-opacity=".72"/>
      <text x="681" y="372" fill="#E2E8F0">MONGODB</text>
      <rect x="780" y="346" width="140" height="42" rx="8" fill="#0F172A" stroke="#8B5CF6" stroke-opacity=".72"/>
