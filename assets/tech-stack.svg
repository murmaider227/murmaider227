<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Murmaider227 technical toolkit</title>
  <desc id="desc">Languages, platform and DevOps tools, databases, and data stores in a terminal-inspired visual system.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070B12"/>
      <stop offset=".58" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#11112A"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#34D399"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#94A3B8" stroke-opacity=".028"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="1198.5" height="418.5" rx="17.25" fill="url(#grid)" stroke="#334155" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="4" rx="2" fill="url(#line)"/>

  <g font-family="'Cascadia Code','SFMono-Regular',Consolas,monospace">
    <circle cx="32" cy="35" r="4.5" fill="#FB7185"/>
    <circle cx="48" cy="35" r="4.5" fill="#FBBF24"/>
    <circle cx="64" cy="35" r="4.5" fill="#34D399"/>
    <text x="89" y="40" fill="#94A3B8" font-size="13">stack@murmaider227: ~/toolkit</text>
    <text x="1168" y="40" text-anchor="end" fill="#475569" font-size="11">19 capabilities loaded</text>

    <text x="44" y="84" fill="#22D3EE" font-size="14" font-weight="700">$</text>
    <text x="64" y="84" fill="#CBD5E1" font-size="13" letter-spacing="1.5">LANGUAGES &amp; APPLICATION DEVELOPMENT</text>
    <path d="M395 79H1156" stroke="#273449"/>

    <g font-size="13.5" font-weight="700" text-anchor="middle">
