      <text x="901" y="276" fill="#E2E8F0">GRAFANA</text>
    </g>

    <text x="44" y="331" fill="#8B5CF6" font-size="14" font-weight="700">$</text>
    <text x="64" y="331" fill="#CBD5E1" font-size="13" letter-spacing="1.5">DATABASES &amp; DATA STORES</text>
    <path d="M333 326H1156" stroke="#273449"/>

    <g font-size="13.5" font-weight="700" text-anchor="middle">
      <rect x="258" y="346" width="170" height="42" rx="8" fill="#0F172A" stroke="#8B5CF6" stroke-opacity=".72"/>
      <text x="343" y="372" fill="#E2E8F0">POSTGRESQL</text>
      <rect x="442" y="346" width="140" height="42" rx="8" fill="#0F172A" stroke="#22D3EE" stroke-opacity=".72"/>
