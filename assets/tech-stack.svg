  <circle cx="1158" cy="406" r="3" fill="#34D399" filter="url(#glow)"/>
  <text x="1146" y="409" text-anchor="end" fill="#64748B" font-family="'Cascadia Code','SFMono-Regular',Consolas,monospace" font-size="10">READY</text>
