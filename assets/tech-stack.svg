      <rect x="460" y="99" width="160" height="42" rx="8" fill="#0F172A" stroke="#22D3EE" stroke-opacity=".72"/>
      <text x="540" y="125" fill="#E2E8F0">JAVASCRIPT</text>
      <rect x="634" y="99" width="108" height="42" rx="8" fill="#0F172A" stroke="#8B5CF6" stroke-opacity=".72"/>
      <text x="688" y="125" fill="#E2E8F0">SWIFT</text>
      <rect x="756" y="99" width="102" height="42" rx="8" fill="#0F172A" stroke="#22D3EE" stroke-opacity=".72"/>
      <text x="807" y="125" fill="#E2E8F0">RUST</text>
      <rect x="872" y="99" width="86" height="42" rx="8" fill="#0F172A" stroke="#8B5CF6" stroke-opacity=".72"/>
      <text x="915" y="125" fill="#E2E8F0">LUA</text>
