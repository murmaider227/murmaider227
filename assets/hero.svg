<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Murmaider227 terminal command center</title>
  <desc id="desc">Software engineering, DevOps, platform, and data systems presented as a production terminal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B12"/>
      <stop offset=".55" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#11112A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22D3EE"/>
      <stop offset=".52" stop-color="#34D399"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity=".035"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="window">
      <rect x="18" y="18" width="1164" height="324" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="360" rx="20" fill="#050810"/>
  <rect x="18" y="18" width="1164" height="324" rx="18" fill="url(#bg)" stroke="#334155"/>
  <g clip-path="url(#window)">
    <rect x="18" y="18" width="1164" height="324" fill="url(#grid)"/>
    <circle cx="1075" cy="285" r="190" fill="#8B5CF6" opacity=".055"/>
    <circle cx="212" cy="368" r="185" fill="#22D3EE" opacity=".04"/>
    <rect x="18" y="18" width="1164" height="42" fill="#0B1020"/>
    <path d="M18 60H1182" stroke="#273449"/>
    <circle cx="43" cy="39" r="5.5" fill="#FB7185"/>
    <circle cx="62" cy="39" r="5.5" fill="#FBBF24"/>
    <circle cx="81" cy="39" r="5.5" fill="#34D399"/>
    <text x="600" y="44" text-anchor="middle" fill="#94A3B8" font-family="'Cascadia Code','SFMono-Regular',Consolas,monospace" font-size="13">murmaider227@platform: ~/profile</text>

    <g font-family="'Cascadia Code','SFMono-Regular',Consolas,monospace">
      <text x="54" y="96" fill="#22D3EE" font-size="16" font-weight="700">$</text>
      <text x="76" y="96" fill="#E2E8F0" font-size="16">whoami</text>
      <text x="54" y="123" fill="#94A3B8" font-size="15">experienced software engineer</text>
      <text x="341" y="123" fill="#475569" font-size="15">·</text>
      <text x="360" y="123" fill="#A78BFA" font-size="15">devops engineer</text>

      <text x="54" y="164" fill="#22D3EE" font-size="16" font-weight="700">$</text>
      <text x="76" y="164" fill="#E2E8F0" font-size="16">deploy</text>
      <text x="140" y="164" fill="#94A3B8" font-size="16">--production --strategy safe</text>
      <text x="54" y="192" fill="#34D399" font-size="14">✓ build</text>
      <text x="143" y="192" fill="#34D399" font-size="14">✓ tests</text>
      <text x="232" y="192" fill="#34D399" font-size="14">✓ rollout</text>
      <text x="341" y="192" fill="#475569" font-size="13">production is healthy</text>

      <text x="54" y="233" fill="#22D3EE" font-size="16" font-weight="700">$</text>
      <text x="76" y="233" fill="#E2E8F0" font-size="16">observe</text>
      <text x="151" y="233" fill="#94A3B8" font-size="16">--services all</text>
      <text x="54" y="261" fill="#34D399" font-size="14">●</text>
      <text x="76" y="261" fill="#CBD5E1" font-size="14">all systems observable</text>

      <text x="54" y="306" fill="#64748B" font-size="12" letter-spacing="2">BUILD  ·  SHIP  ·  OBSERVE</text>
      <rect x="315" y="294" width="9" height="16" fill="#22D3EE" opacity=".9">
        <animate attributeName="opacity" values=".9;.15;.9" dur="1.4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <path d="M560 82V296" stroke="#334155" stroke-dasharray="3 7"/>

    <g transform="translate(596 83)">
      <rect width="542" height="214" rx="14" fill="url(#panel)" stroke="#334155"/>
      <path d="M0 14A14 14 0 0 1 14 0H528A14 14 0 0 1 542 14V16H0Z" fill="url(#accent)" opacity=".9"/>
      <text x="28" y="57" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="800" letter-spacing="1.4">MURMAIDER227</text>
      <text x="29" y="81" fill="#94A3B8" font-family="'Cascadia Code','SFMono-Regular',Consolas,monospace" font-size="11.5" letter-spacing="1.25">SOFTWARE ENGINEERING · DEVOPS · PLATFORM · DATA</text>
      <path d="M28 100H514" stroke="#273449"/>
      <text x="29" y="126" fill="#64748B" font-family="'Cascadia Code','SFMono-Regular',Consolas,monospace" font-size="11" letter-spacing="1.8">ENGINEERING FOCUS</text>

      <g font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#CBD5E1">
        <circle cx="34" cy="151" r="4" fill="#22D3EE" filter="url(#glow)"/>
        <text x="49" y="156">Reliable delivery</text>
        <circle cx="222" cy="151" r="4" fill="#34D399" filter="url(#glow)"/>
        <text x="237" y="156">Automated operations</text>
        <circle cx="34" cy="183" r="4" fill="#8B5CF6" filter="url(#glow)"/>
        <text x="49" y="188">Observable systems</text>
        <circle cx="222" cy="183" r="4" fill="#22D3EE" filter="url(#glow)"/>
        <text x="237" y="188">Production ownership</text>
      </g>
    </g>
  </g>
  <rect x="18" y="18" width="1164" height="324" rx="18" fill="none" stroke="url(#accent)" stroke-opacity=".42"/>
</svg>
