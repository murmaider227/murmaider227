    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity="0.08"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="26" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="318" rx="25" fill="none" stroke="url(#accent)" stroke-opacity="0.72"/>
  <rect x="18" y="18" width="1164" height="284" rx="18" fill="url(#grid)"/>
  <circle cx="110" cy="56" r="260" fill="url(#purpleGlow)"/>
  <circle cx="1095" cy="270" r="270" fill="url(#cyanGlow)"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#8B5CF6" stroke-opacity="0.42" stroke-width="2">
      <path d="M70 95L132 62L194 98L158 153L84 152Z"/>
      <path d="M132 62V126M84 152L132 126L158 153M194 98L132 126"/>
    </g>
    <g fill="#0B1120" stroke="#A78BFA" stroke-width="2">
      <circle cx="70" cy="95" r="7"/>
      <circle cx="132" cy="62" r="7"/>
      <circle cx="194" cy="98" r="7"/>
      <circle cx="84" cy="152" r="7"/>
      <circle cx="132" cy="126" r="9"/>
      <circle cx="158" cy="153" r="7"/>
    </g>

