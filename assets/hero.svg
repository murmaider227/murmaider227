      <rect width="142" height="42" rx="9"/>
      <rect y="57" width="142" height="42" rx="9"/>
      <rect y="114" width="142" height="42" rx="9"/>
      <path d="M28 42V57M71 42V57M114 42V57M28 99V114M71 99V114M114 99V114"/>
      <circle cx="20" cy="21" r="4" fill="#22D3EE" stroke="none"/>
      <circle cx="20" cy="78" r="4" fill="#22D3EE" stroke="none"/>
      <circle cx="20" cy="135" r="4" fill="#22D3EE" stroke="none"/>
      <path d="M35 21H119M35 78H119M35 135H119" stroke-opacity="0.3"/>
    </g>
